name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      KNOWLEDGE_ROOT: ${{ runner.temp }}/github-pattern-knowledge
      EXTRACTOR_MODE: heuristic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run deterministic daily smoke test
        run: npm run daily -- --fixture

      - name: Validate generated knowledge
        run: npm run harness
