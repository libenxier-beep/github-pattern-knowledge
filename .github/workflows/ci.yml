name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run deterministic daily smoke test
        env:
          KNOWLEDGE_ROOT: /tmp/github-pattern-knowledge-ci
          EXTRACTOR_MODE: heuristic
        run: npm run daily -- --fixture

      - name: Validate generated knowledge
        env:
          KNOWLEDGE_ROOT: /tmp/github-pattern-knowledge-ci
        run: npm run harness
